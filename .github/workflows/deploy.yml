name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build:ci

      - name: Build Pages Functions Worker
        run: |
          pnpm dlx wrangler@4.83.0 pages functions build functions --build-output-directory dist --outfile /tmp/eduagent-worker.js --output-routes-path /tmp/eduagent-routes.json
          test -s /tmp/eduagent-worker.js
          test -s /tmp/eduagent-routes.json
          cp /tmp/eduagent-worker.js dist/_worker.js
          cp /tmp/eduagent-routes.json dist/_routes.json

      - name: Verify Pages Functions Worker
        run: test -s dist/_worker.js && grep -Fq '/eduagent/api/:path*' dist/_worker.js

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }}

name: EduAgent Turnstile setup

on:
  workflow_dispatch:
    inputs:
      widget_name:
        description: 'Turnstile widget name'
        default: 'EduAgent'
      domains:
        description: 'Comma separated allowed hostnames'
        default: 'eduagent.ejuerz.com,ejuerz.com,localhost,127.0.0.1'
      mode:
        description: 'managed / non-interactive / invisible'
        default: 'managed'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create Turnstile widget
        id: widget
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WIDGET_NAME: ${{ inputs.widget_name }}
          DOMAINS: ${{ inputs.domains }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing"
            exit 1
          fi
          payload=$(jq -nc --arg n "$WIDGET_NAME" --arg m "$MODE" --arg d "$DOMAINS" \
            '{name:$n, mode:$m, domains:($d|split(",")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0)))}')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/challenges/turnstile/widgets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" > /tmp/widget.json
          if [ "$(jq -r '.success' /tmp/widget.json)" != "true" ]; then
            echo "::error::Cloudflare API error: $(jq -c '.errors' /tmp/widget.json)"
            exit 1
          fi
          sitekey=$(jq -r '.result.sitekey' /tmp/widget.json)
          echo "sitekey=${sitekey}" >> "$GITHUB_OUTPUT"
          {
            echo "widget_id=$(jq -r '.result.id' /tmp/widget.json)"
            echo "domains=$(jq -r '.result.domains|join(",")' /tmp/widget.json)"
          } >> "$GITHUB_OUTPUT"
          # 公开的 site key 写入仓库变量，secret 永不输出到日志
          if command -v gh >/dev/null 2>&1; then
            printf '%s' "${sitekey}" | gh variable set EDUAGENT_TURNSTILE_SITE_KEY --repo "${GITHUB_REPOSITORY}" \
              || echo "::warning::could not write the repository variable automatically"
          fi

      - name: Summary
        env:
          SITEKEY: ${{ steps.widget.outputs.sitekey }}
          WIDGET_ID: ${{ steps.widget.outputs.widget_id }}
          DOMAINS: ${{ steps.widget.outputs.domains }}
        run: |
          {
            echo '### Turnstile widget created'
            echo
            echo "- widget id: \`${WIDGET_ID}\`"
            echo "- allowed domains: ${DOMAINS}"
            echo "- site key (public, goes into the frontend build): \`${SITEKEY}\`"
            echo
            echo 'Next steps:'
            echo '1. Open Cloudflare dashboard → Turnstile → this widget → copy the **secret key** (it is not printed here on purpose).'
            echo '2. Paste it into Supabase → Authentication → Attack Protection → Turnstile, then enable the protected flows (signup / signin / password reset).'
            echo '3. The frontend build picks up the site key from the repository variable `EDUAGENT_TURNSTILE_SITE_KEY`.'
          } >> "$GITHUB_STEP_SUMMARY"
